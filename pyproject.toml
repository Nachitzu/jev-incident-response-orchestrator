[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-incident-response-orchestrator"
version = "0.1.0"
description = "Multi-agent SOAR-style incident response orchestrator (detect -> investigate -> respond)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nachitzu" }]

dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.9.0",
    "typesafe-sdk[zstd,http2]>=0.2.0",
    "httpx>=0.27.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
]

[project.scripts]
soar-orchestrator = "src.orchestrator.cli:main"
soar-tool = "src.orchestrator.toolcli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src"]
